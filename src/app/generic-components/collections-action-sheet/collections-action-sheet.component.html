<ion-button [id]="'collections_' + recipy().id" [color]="buttonColor()" fill="clear">
  @if(isIconPresentation()){
  <span>
    <ion-icon slot="icon-only" name="bookmarks-outline"></ion-icon>
  </span>
  }
  @else {
  <span>{{buttonTitle()}}</span>
  }
</ion-button>
<ion-action-sheet [trigger]="'collections_' + recipy().id" [header]="recipy().name " (didDismiss)="onDismissed($event)"
  [buttons]="collectionList()">
</ion-action-sheet>
