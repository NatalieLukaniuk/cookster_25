<ion-app>
  <ion-menu contentId="main-content">

    <ion-content>
      <ion-menu-toggle>
        <ion-list lines="full">
          @if(!isLoggedIn()){
          <ion-item href="/login" router-direction="root">
            Log in
          </ion-item>
          }
          @if(isLoggedIn()){
          <ion-item href="/calendar" router-direction="root">
            Calendar
          </ion-item>
          }

          <ion-item href="/home" router-direction="root">
            Home
          </ion-item>
        </ion-list>

      </ion-menu-toggle>

    </ion-content>
  </ion-menu>
  <div id="main-content" class="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>
          <!-- TODO Dynamic page name here -->
          Menu
        </ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
  </div>

</ion-app>
