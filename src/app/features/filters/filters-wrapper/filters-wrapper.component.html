<ion-button [id]="'filters-modal'">
  <ion-icon slot="icon-only" name="filter-outline"></ion-icon>
</ion-button>

<ion-modal [trigger]="'filters-modal'" [initialBreakpoint]="0.75" [breakpoints]="[0.25, 0.5, 0.75, 1]">
  <ng-template>
    <ion-header>
      <ion-title>
        <h5 class="found-recipies-count">Знайдено {{ recipiesService.filteredRecipiesCount() }} рецептів</h5>
      </ion-title>
    </ion-header>
    <ion-content>
      <div class="filter-item">
        <app-search-recipies-filter></app-search-recipies-filter>
      </div>
      <div class="filter-item">
        <app-sorting-filter></app-sorting-filter>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
